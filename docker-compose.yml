name: multivisons-local

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: multivisons
      POSTGRES_USER: multivisons
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multivisons -d multivisons"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-storage:
    image: minio/minio:latest
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-minio
      MINIO_ROOT_PASSWORD: local-minio-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-storage-data:/data

volumes:
  postgres-data:
  object-storage-data:
